{% extends 'base.html' %}

{% block title %}Edit Class - BrightTrack{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="bg-white dark:bg-gray-800 rounded-lg shadow-sm border border-gray-200 dark:border-gray-700 p-8">
        <h2 class="text-2xl font-bold text-gray-900 dark:text-white mb-6">Edit Class</h2>
        
        <form method="post" class="space-y-6">
            {% csrf_token %}
            
            <div>
                <label for="name" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
                    Class Name
                </label>
                <input type="text" id="name" name="name" value="{{ class.name }}" required
                       class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg focus:ring-2 focus:ring-red-500 focus:border-transparent transition">
            </div>
            
            <div>
                <label for="description" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
                    Description (Optional)
                </label>
                <textarea id="description" name="description" rows="3"
                          class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg focus:ring-2 focus:ring-red-500 focus:border-transparent transition">{{ class.description }}</textarea>
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
                    Schedule (Optional)
                </label>
                <div class="rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-900/30 p-4 space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 dark:text-gray-400 mb-3">Class Days</label>
                        <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
                            {% for value, label in day_choices %}
                            <label class="flex items-center gap-2 px-3 py-2 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg hover:border-red-400 transition cursor-pointer">
                                <input type="checkbox" name="schedule_days" value="{{ value }}"
                                    class="rounded border-gray-300 text-red-600 focus:ring-red-500"
                                    {% if value in selected_days %}checked{% endif %}>
                                <span class="text-sm text-gray-700 dark:text-gray-200">{{ label }}</span>
                            </label>
                            {% endfor %}
                        </div>
                    </div>
                    <div class="grid md:grid-cols-2 gap-4">
                        <div>
                            <label for="schedule_start_time" class="block text-xs font-semibold text-gray-600 dark:text-gray-400 mb-1">Start Time</label>
                            <input type="time" id="schedule_start_time" name="schedule_start_time" value="{{ selected_start_time }}"
                                class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg focus:ring-2 focus:ring-red-500 focus:border-transparent transition">
                        </div>
                        <div>
                            <label for="schedule_end_time" class="block text-xs font-semibold text-gray-600 dark:text-gray-400 mb-1">End Time</label>
                            <input type="time" id="schedule_end_time" name="schedule_end_time" value="{{ selected_end_time }}"
                                class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg focus:ring-2 focus:ring-red-500 focus:border-transparent transition">
                        </div>
                    </div>
                </div>
            </div>
            
            <div>
                <label for="room" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
                    Room (Optional)
                </label>
                <input type="text" id="room" name="room" value="{{ class.room }}" placeholder="e.g., Room 101"
                       class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg focus:ring-2 focus:ring-red-500 focus:border-transparent transition">
            </div>
            
            <div class="flex gap-4">
                <button type="submit" 
                        class="flex-1 bg-red-600 text-white py-3 rounded-lg font-semibold hover:bg-red-700 transition duration-200">
                    Save Changes
                </button>
                <a href="{% url 'academics:class_detail' class.id %}" 
                   class="flex-1 bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-300 py-3 rounded-lg font-semibold hover:bg-gray-300 dark:hover:bg-gray-600 transition duration-200 text-center">
                    Cancel
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
