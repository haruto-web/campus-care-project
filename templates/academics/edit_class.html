{% extends 'base.html' %}

{% block title %}Edit Class{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="bg-white dark:bg-gray-800 rounded-lg shadow-sm border border-gray-200 dark:border-gray-700 p-8">
        <h2 class="text-2xl font-bold text-gray-900 dark:text-white mb-6">Edit Class</h2>
        
        <form method="post" class="space-y-6">
            {% csrf_token %}
            
            <div>
                <label for="name" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
                    Class Name
                </label>
                <input type="text" id="name" name="name" value="{{ class.name }}" required
                       class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg focus:ring-2 focus:ring-red-500 focus:border-transparent transition">
            </div>
            
            <div>
                <label for="description" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
                    Description (Optional)
                </label>
                <textarea id="description" name="description" rows="3"
                          class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg focus:ring-2 focus:ring-red-500 focus:border-transparent transition">{{ class.description }}</textarea>
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
                    Schedule
                </label>
                <div class="rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-900/30 p-4 space-y-4">
                    <input type="hidden" id="id_schedule_blocks" name="schedule_blocks" value="{{ schedule_blocks_json|default:'[]'|escape }}">
                    <div id="scheduleBlocks" class="space-y-4"></div>
                    <button type="button" id="addScheduleButton" class="inline-flex items-center gap-2 px-4 py-2 border border-red-300 text-red-600 rounded-lg hover:bg-red-50 dark:hover:bg-red-900/20 transition font-medium">
                        <i class="bi bi-plus-circle"></i> Add Schedule
                    </button>
                </div>
                <p class="text-sm text-gray-500 dark:text-gray-400 mt-2">Add separate schedule entries when this class meets on different days with different times.</p>
            </div>
            
            <div class="flex gap-4">
                <button type="submit" 
                        class="flex-1 bg-red-600 text-white py-3 rounded-lg font-semibold hover:bg-red-700 transition duration-200">
                    Save Changes
                </button>
                <a href="{% url 'academics:class_detail' class.id %}" 
                   class="flex-1 bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-300 py-3 rounded-lg font-semibold hover:bg-gray-300 dark:hover:bg-gray-600 transition duration-200 text-center">
                    Cancel
                </a>
            </div>
        </form>
    </div>
</div>
<script>
    (function () {
        const dayChoices = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
        const blocksContainer = document.getElementById('scheduleBlocks');
        const hiddenInput = document.getElementById('id_schedule_blocks');
        const addButton = document.getElementById('addScheduleButton');

        function readBlocks() {
            try {
                const parsed = JSON.parse(hiddenInput.value || '[]');
                return Array.isArray(parsed) ? parsed : [];
            } catch (e) {
                return [];
            }
        }

        function writeBlocks() {
            const blocks = Array.from(blocksContainer.querySelectorAll('[data-schedule-block]')).map((block) => ({
                days: Array.from(block.querySelectorAll('input[type="checkbox"]:checked')).map((input) => input.value),
                start_time: block.querySelector('[data-start-time]').value,
                end_time: block.querySelector('[data-end-time]').value,
                classroom: block.querySelector('[data-classroom]').value
            }));
            hiddenInput.value = JSON.stringify(blocks);
        }

        function renderBlock(block = {}, index = 0) {
            const wrapper = document.createElement('div');
            wrapper.setAttribute('data-schedule-block', 'true');
            wrapper.className = 'rounded-xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 p-4 space-y-4';

            wrapper.innerHTML = `
                <div class="flex items-center justify-between gap-3">
                    <label class="text-sm font-semibold text-gray-700 dark:text-gray-200">Schedule ${index + 1}</label>
                    <button type="button" class="text-sm text-red-500 hover:text-red-600 ${index === 0 ? 'hidden' : ''}" data-remove-schedule>Remove</button>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 dark:text-gray-400 mb-3">Class Days</label>
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
                        ${dayChoices.map((day) => `
                            <label class="flex items-center gap-2 px-3 py-2 bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-lg hover:border-red-400 transition cursor-pointer">
                                <input type="checkbox" value="${day}" class="rounded border-gray-300 text-red-600 focus:ring-red-500" ${(block.days || []).includes(day) ? 'checked' : ''}>
                                <span class="text-sm text-gray-700 dark:text-gray-200">${day}</span>
                            </label>
                        `).join('')}
                    </div>
                </div>
                <div class="grid md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 dark:text-gray-400 mb-1">Start Time</label>
                        <input type="time" value="${block.start_time || ''}" data-start-time class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg focus:ring-2 focus:ring-red-500 focus:border-transparent transition">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 dark:text-gray-400 mb-1">End Time</label>
                        <input type="time" value="${block.end_time || ''}" data-end-time class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg focus:ring-2 focus:ring-red-500 focus:border-transparent transition">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 dark:text-gray-400 mb-1">Classroom</label>
                    <input type="text" value="${block.classroom || ''}" data-classroom placeholder="e.g., Room 301" class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg focus:ring-2 focus:ring-red-500 focus:border-transparent transition">
                </div>
            `;

            wrapper.querySelector('[data-remove-schedule]').addEventListener('click', function () {
                wrapper.remove();
                writeBlocks();
                rerender();
            });

            wrapper.querySelectorAll('input').forEach((input) => input.addEventListener('change', writeBlocks));
            return wrapper;
        }

        function rerender() {
            const blocks = readBlocks();
            blocksContainer.innerHTML = '';
            const items = blocks.length ? blocks : [{}];
            items.forEach((block, index) => blocksContainer.appendChild(renderBlock(block, index)));
            writeBlocks();
        }

        addButton.addEventListener('click', function () {
            const blocks = readBlocks();
            blocks.push({});
            hiddenInput.value = JSON.stringify(blocks);
            rerender();
        });

        hiddenInput.form.addEventListener('submit', writeBlocks);
        rerender();
    })();
</script>
{% endblock %}
