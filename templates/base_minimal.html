<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Campus Care{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body {
            overflow-x: hidden;
        }
        img, svg, video, canvas {
            max-width: 100%;
            height: auto;
        }
        @media (max-width: 640px) {
            .container, .container-fluid {
                padding-left: 12px;
                padding-right: 12px;
            }
            .table-responsive, .overflow-x-auto {
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
            }
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body style="margin: 0; padding: 0;">
    {% block content %}{% endblock %}
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function enforceCurrentDateTimeInputs() {
            const now = new Date();
            const today = new Date(now.getTime() - (now.getTimezoneOffset() * 60000)).toISOString().slice(0, 10);
            const currentDateTime = new Date(now.getTime() - (now.getTimezoneOffset() * 60000)).toISOString().slice(0, 16);

            document.querySelectorAll('input[type="date"]').forEach(input => {
                if (!input.min || input.min < today) input.min = today;
                if (input.value && input.value < input.min) input.value = input.min;
            });

            document.querySelectorAll('input[type="datetime-local"]').forEach(input => {
                if (!input.min || input.min < currentDateTime) input.min = currentDateTime;
                if (input.value && input.value < input.min) input.value = input.min;
            });
        }

        document.addEventListener('DOMContentLoaded', enforceCurrentDateTimeInputs);
        document.addEventListener('focusin', function (event) {
            if (event.target.matches('input[type="date"], input[type="datetime-local"]')) {
                enforceCurrentDateTimeInputs();
            }
        });
        document.addEventListener('change', function (event) {
            const input = event.target;
            if (input.matches('input[type="date"]') && input.value && input.min && input.value < input.min) {
                input.value = input.min;
            }
            if (input.matches('input[type="datetime-local"]') && input.value && input.min && input.value < input.min) {
                input.value = input.min;
            }
        });

        {% if user.is_authenticated %}
        (function () {
            let handlingSessionExpiry = false;

            function showSessionExpiredPrompt(message) {
                if (handlingSessionExpiry) return;
                handlingSessionExpiry = true;

                const overlay = document.createElement('div');
                overlay.style.position = 'fixed';
                overlay.style.inset = '0';
                overlay.style.background = 'rgba(15, 23, 42, 0.45)';
                overlay.style.display = 'flex';
                overlay.style.alignItems = 'center';
                overlay.style.justifyContent = 'center';
                overlay.style.zIndex = '99999';

                const panel = document.createElement('div');
                panel.style.width = 'min(92vw, 420px)';
                panel.style.background = '#fff';
                panel.style.borderRadius = '16px';
                panel.style.overflow = 'hidden';
                panel.style.boxShadow = '0 20px 40px rgba(15,23,42,0.28)';
                panel.innerHTML = `
                    <div style="padding:12px 16px;background:#eef2ff;border-bottom:1px solid #e5e7eb;font-weight:700;color:#111827;">Session Expired</div>
                    <div style="padding:16px;color:#4b5563;">${message}</div>
                    <div style="padding:0 16px 16px;text-align:right;">
                        <button id="sessionExpiredContinueBtn" style="background:#4f46e5;color:#fff;border:none;border-radius:10px;padding:8px 16px;font-weight:600;cursor:pointer;">Continue</button>
                    </div>
                `;
                overlay.appendChild(panel);
                document.body.appendChild(overlay);

                const continueBtn = panel.querySelector('#sessionExpiredContinueBtn');
                continueBtn.addEventListener('click', function () {
                    window.location.href = '{% url "session_expired_notice" %}';
                });
            }

            function heartbeat() {
                fetch('{% url "session_heartbeat" %}', {
                    headers: {
                        'X-Requested-With': 'XMLHttpRequest',
                        'Accept': 'application/json'
                    }
                })
                .then(function (res) {
                    if (res.status === 440) {
                        return res.json().then(function (data) {
                            const msg = (data && data.message) ? data.message : 'This account was logged in on another device.';
                            showSessionExpiredPrompt(msg);
                        });
                    }
                })
                .catch(function () { });
            }

            setInterval(heartbeat, 4000);
        })();
        {% endif %}
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
