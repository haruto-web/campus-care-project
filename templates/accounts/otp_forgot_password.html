{% extends 'base.html' %}
{% load static %}
{% block title %}Forgot Password - BrightTrack{% endblock %}

{% block content %}
<style>
    .forgot-scene {
        position: relative;
        overflow: hidden;
    }
    .forgot-blob {
        position: absolute;
        border-radius: 9999px;
        filter: blur(40px);
        opacity: 0.22;
        pointer-events: none;
        animation: forgotBlobDrift 12s ease-in-out infinite;
    }
    .forgot-blob-a {
        width: 260px;
        height: 260px;
        background: #4f46e5;
        top: 8%;
        left: 8%;
        animation-delay: 0s;
    }
    .forgot-blob-b {
        width: 300px;
        height: 300px;
        background: #14b8a6;
        bottom: 6%;
        right: 10%;
        animation-delay: 1.2s;
    }
    .forgot-blob-c {
        width: 220px;
        height: 220px;
        background: #60a5fa;
        top: 20%;
        right: 22%;
        animation-delay: 2.1s;
    }
    @keyframes forgotBlobDrift {
        0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
        50% { transform: translate3d(10px, -14px, 0) scale(1.05); }
    }
    .forgot-card {
        animation: forgotCardIn 0.48s ease-out both;
    }
    @keyframes forgotCardIn {
        from { opacity: 0; transform: translateY(12px); }
        to { opacity: 1; transform: translateY(0); }
    }
    .forgot-logo-float {
        animation: forgotLogoFloat 5.8s ease-in-out infinite;
    }
    @keyframes forgotLogoFloat {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-4px); }
    }
    .forgot-focus-field {
        transition: box-shadow 0.22s ease, border-color 0.22s ease;
    }
    .forgot-focus-field:focus {
        box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.16);
    }
    .forgot-shimmer {
        position: relative;
        overflow: hidden;
    }
    .forgot-shimmer::after {
        content: "";
        position: absolute;
        top: 0;
        left: -140%;
        width: 60%;
        height: 100%;
        background: linear-gradient(100deg, transparent 0%, rgba(255,255,255,0.32) 50%, transparent 100%);
        transform: skewX(-18deg);
        transition: left 0.5s ease;
    }
    .forgot-shimmer:hover::after {
        left: 190%;
    }
    @media (prefers-reduced-motion: reduce) {
        .forgot-blob,
        .forgot-card,
        .forgot-logo-float {
            animation: none !important;
        }
        .forgot-shimmer::after {
            transition: none !important;
        }
    }
</style>
<div class="forgot-scene min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8" style="background:var(--bt-bg)">
    <div class="forgot-blob forgot-blob-a"></div>
    <div class="forgot-blob forgot-blob-b"></div>
    <div class="forgot-blob forgot-blob-c"></div>

    <div class="max-w-md w-full">
        <div class="forgot-card bg-white dark:bg-gray-800 rounded-2xl shadow-xl border border-gray-100 dark:border-gray-700 p-8 relative">
            <div class="text-center mb-8">
                <div class="forgot-logo-float inline-flex items-center justify-center w-16 h-16 mb-4">
                    <img src="{% static 'images/logo.png' %}" alt="BrightTrack" class="w-16 h-16 object-contain">
                </div>
                <h2 class="text-3xl font-bold text-gray-900 dark:text-white">BrightTrack</h2>
                <p class="text-gray-600 dark:text-gray-400 mt-2">Reset your password</p>
            </div>

            {% if messages %}
                {% for msg in messages %}
                <div class="mb-4 p-4 bg-red-50 border border-red-200 rounded-xl">
                    <p class="text-red-800 text-sm">{{ msg }}</p>
                </div>
                {% endfor %}
            {% endif %}

            <form method="post" class="space-y-6">
                {% csrf_token %}
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Email Address</label>
                    <input type="email" id="email" name="email" required autofocus
                           class="forgot-focus-field w-full px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-xl bg-white dark:bg-gray-700 text-gray-900 dark:text-white focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition placeholder-gray-400 dark:placeholder-gray-500"
                           placeholder="Enter your email">
                </div>
                <button type="submit"
                        class="forgot-shimmer w-full bg-indigo-600 text-white py-3 rounded-xl font-semibold hover:bg-indigo-700 transition duration-200 shadow-md shadow-indigo-200 dark:shadow-none">
                    Send Reset Code
                </button>
            </form>

            <div class="text-center mt-6">
                <a href="{% url 'login' %}" class="text-sm text-indigo-600 dark:text-indigo-400 hover:text-indigo-700">Back to login</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
