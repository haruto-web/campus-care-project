{% extends 'base.html' %}
{% load static %}
{% block title %}Create Account{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gray-50 py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full">
        <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-8">
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-16 h-16 mb-4">
                    <img src="{% static 'images/logo.png' %}" alt="BrightTrack" class="w-16 h-16 object-contain">
                </div>
                <h2 class="text-3xl font-bold text-gray-900">BrightTrack</h2>
                <p class="text-gray-600 mt-2">Create your student account</p>
                <p class="text-sm text-gray-500 mt-1">Verified: <strong>{{ email }}</strong></p>
            </div>

            {% if messages %}
                {% for msg in messages %}
                <div class="mb-4 p-4 rounded-lg {% if 'success' in msg.tags %}bg-green-50 border border-green-200{% elif 'warning' in msg.tags %}bg-yellow-50 border border-yellow-200{% elif 'info' in msg.tags %}bg-blue-50 border border-blue-200{% else %}bg-red-50 border border-red-200{% endif %}">
                    <p class="text-sm {% if 'success' in msg.tags %}text-green-800{% elif 'warning' in msg.tags %}text-yellow-800{% elif 'info' in msg.tags %}text-blue-800{% else %}text-red-800{% endif %}">{{ msg }}</p>
                </div>
                {% endfor %}
            {% endif %}

            <form method="post" class="space-y-4" id="registerForm">
                {% csrf_token %}
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">First Name</label>
                    <input type="text" name="first_name" required
                           class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:border-transparent transition">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Last Name</label>
                    <input type="text" name="last_name" required
                           class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:border-transparent transition">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Password</label>
                    <div class="relative">
                        <input type="password" name="password" id="password" required minlength="8"
                               class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:border-transparent transition pr-12">
                        <button type="button" onclick="togglePassword('password', 'eyeIcon1')"
                                class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600">
                            <i class="bi bi-eye" id="eyeIcon1"></i>
                        </button>
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Confirm Password</label>
                    <div class="relative">
                        <input type="password" name="password2" id="password2" required minlength="8"
                               class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:border-transparent transition pr-12"
                               oninput="checkMatch()">
                        <button type="button" onclick="togglePassword('password2', 'eyeIcon2')"
                                class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600">
                            <i class="bi bi-eye" id="eyeIcon2"></i>
                        </button>
                    </div>
                    <p id="matchMsg" class="text-xs mt-1 hidden"></p>
                </div>
                <button type="submit"
                        class="w-full bg-red-600 text-white py-3 rounded-lg font-semibold hover:bg-red-700 transition duration-200 mt-2">
                    Create Account
                </button>
            </form>
        </div>
    </div>
</div>

<script>
function togglePassword(fieldId, iconId) {
    const field = document.getElementById(fieldId);
    const icon = document.getElementById(iconId);
    if (field.type === 'password') {
        field.type = 'text';
        icon.className = 'bi bi-eye-slash';
    } else {
        field.type = 'password';
        icon.className = 'bi bi-eye';
    }
}

function checkMatch() {
    const p1 = document.getElementById('password').value;
    const p2 = document.getElementById('password2').value;
    const msg = document.getElementById('matchMsg');
    if (p2.length === 0) { msg.classList.add('hidden'); return; }
    msg.classList.remove('hidden');
    if (p1 === p2) {
        msg.textContent = '✓ Passwords match';
        msg.className = 'text-xs mt-1 text-green-600';
    } else {
        msg.textContent = '✗ Passwords do not match';
        msg.className = 'text-xs mt-1 text-red-600';
    }
}
</script>
{% endblock %}
