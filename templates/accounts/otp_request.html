{% extends 'base.html' %}
{% block title %}Student Login - BrightTrack{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gray-50 py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full">
        <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-8">
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-16 h-16 bg-red-100 rounded-full mb-4">
                    <i class="bi bi-heart-pulse text-red-600 text-3xl"></i>
                </div>
                <h2 class="text-3xl font-bold text-gray-900">BrightTrack</h2>
                <p class="text-gray-600 mt-2">Student Login / Register</p>
            </div>

            {% if messages %}
                {% for msg in messages %}
                <div class="mb-4 p-4 bg-red-50 border border-red-200 rounded-lg">
                    <p class="text-red-800 text-sm">{{ msg }}</p>
                </div>
                {% endfor %}
            {% endif %}

            <form method="post" class="space-y-6">
                {% csrf_token %}
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-2">Email Address</label>
                    <input type="email" id="email" name="email" required autofocus
                           class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:border-transparent transition">
                </div>
                <button type="submit"
                        class="w-full bg-red-600 text-white py-3 rounded-lg font-semibold hover:bg-red-700 transition duration-200">
                    Continue
                </button>
            </form>

            <div class="text-center mt-6">
                <p class="text-gray-600 text-sm">Staff / Teacher?
                    <a href="{% url 'login' %}" class="text-red-600 hover:text-red-700 font-semibold">Click here</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
