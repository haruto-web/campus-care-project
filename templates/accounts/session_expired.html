{% extends 'base_minimal.html' %}
{% load static %}
{% block title %}Session Expired - BrightTrack{% endblock %}

{% block content %}
<div class="min-vh-100 d-flex align-items-center justify-content-center" style="background:#f5f7fb;padding:24px;">
    <div class="card shadow-sm border-0" style="max-width:460px;width:100%;border-radius:16px;">
        <div class="card-body p-4 p-md-5 text-center">
            <img src="{% static 'images/logo.png' %}" alt="BrightTrack" style="width:56px;height:56px;object-fit:contain;" class="mb-3">
            <h2 class="h4 fw-bold mb-3 text-dark">Session Expired</h2>
            <p class="text-muted mb-4">
                This account was logged in on another device. For your security, you must confirm before continuing.
            </p>
            <form method="post" class="d-grid gap-2">
                {% csrf_token %}
                <button type="submit" class="btn py-2 fw-semibold text-white" style="background:#4f46e5;border-color:#4f46e5;">Continue to Login</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
