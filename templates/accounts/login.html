{% extends 'base.html' %}
{% load static %}
{% block title %}Login - BrightTrack{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8" style="background:var(--bt-bg)">
    <div class="max-w-md w-full">
        <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-xl border border-gray-100 dark:border-gray-700 p-8">
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-16 h-16 mb-4">
                    <img src="{% static 'images/logo.png' %}" alt="BrightTrack" class="w-16 h-16 object-contain">
                </div>
                <h2 class="text-3xl font-bold text-gray-900 dark:text-white">BrightTrack</h2>
                <p class="text-gray-600 dark:text-gray-400 mt-2">Sign in to your account</p>
            </div>

            <form method="post" class="space-y-6">
                {% csrf_token %}
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Email</label>
                    <input type="email" id="email" name="email" required autofocus
                        class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-xl bg-white dark:bg-gray-700 text-gray-900 dark:text-white focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition placeholder-gray-400 dark:placeholder-gray-500"
                        placeholder="Enter your email">
                </div>
                <div>
                    <div class="flex justify-between items-center mb-2">
                        <label for="password" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Password</label>
                        <a href="{% url 'otp_forgot_password' %}" class="text-xs text-indigo-600 dark:text-indigo-400 hover:text-indigo-700">Forgot password?</a>
                    </div>
                    <div class="relative">
                        <input type="password" id="password" name="password" required
                            class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-xl bg-white dark:bg-gray-700 text-gray-900 dark:text-white focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition pr-12 placeholder-gray-400 dark:placeholder-gray-500"
                            placeholder="Enter your password">
                        <button type="button" onclick="togglePassword()"
                            class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 dark:hover:text-gray-300">
                            <i class="bi bi-eye" id="eyeIcon"></i>
                        </button>
                    </div>
                </div>
                <button type="submit"
                    class="w-full bg-indigo-600 text-white py-3 rounded-xl font-semibold hover:bg-indigo-700 transition duration-200 shadow-md shadow-indigo-200 dark:shadow-none">
                    Sign In
                </button>
            </form>

            <div class="text-center mt-6">
                <p class="text-gray-600 dark:text-gray-400 text-sm">New student?
                    <a href="{% url 'register' %}" class="text-indigo-600 dark:text-indigo-400 hover:text-indigo-700 font-semibold">Create an account</a>
                </p>
            </div>
        </div>
    </div>
</div>

<script>
    function togglePassword() {
        const field = document.getElementById('password');
        const icon = document.getElementById('eyeIcon');
        if (field.type === 'password') {
            field.type = 'text';
            icon.className = 'bi bi-eye-slash';
        } else {
            field.type = 'password';
            icon.className = 'bi bi-eye';
        }
    }
</script>
{% endblock %}
